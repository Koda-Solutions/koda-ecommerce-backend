spring.application.name=notification-ms
application.name=dev
server.port=8100
server.servlet.context-path=/api/notification

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/ecommerce_notification
spring.datasource.username=${MYSQL_USER:koda_notification_ms}
spring.datasource.password=${MYSQL_PASSWORD:koda_notification_ms_pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
