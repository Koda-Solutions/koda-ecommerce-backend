# ==================================================
# Application Info
# ==================================================
spring.application.name=user-ms
application.name=dev
server.port=8040
server.servlet.context-path=/api/user

# ==================================================
# Data Source (one schema per service, one least privilege user)
# ==================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/ecommerce_user
spring.datasource.username=${MYSQL_USER:koda_user_ms}
spring.datasource.password=${MYSQL_PASSWORD:koda_user_ms_pw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ==================================================
# Flyway owns the user schema
# ==================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ==================================================
# Auth
# ==================================================
auth.issuer=koda-ecommerce-user/1
auth.access-token-ttl-seconds=900
auth.refresh-token-ttl-days=30
auth.cookie-secure=${COOKIE_SECURE:false}
auth.rate-limit.max-failures=${MAX_FAILURES:5}
auth.rate-limit.window-minutes=${WINDOW_MINUTES:60}

# ==================================================
# Health
# ==================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ==================================================
# Outbound Feign (secrets come from the environment, never committed)
# ==================================================
spring.cloud.openfeign.enabled=true