name: mockshop
services:
  mysql:
    image: mysql:8.4
    container_name: koda-ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-koda_root_pw}
    ports:
      - "3307:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-koda_root_pw}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Each Spring Boot service joins below as feature tasks build them (EC-BP-5
  # builds the baseline, EC-110 wires the compose file). Services expose only
  # the storefront ports; /internal/* endpoints stay inside the network
  # perimeter (SEC-02).

volumes:
  mysql-data: